<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — أصالة التراث المصري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --black:#0b0908; --wine:#6d2230; --wine-deep:#4a1620;
      --gold:#c6a86a; --gold-light:#d9bd82; --beige:#f9f5ef;
      --muted:#6c584d; --white:#fff; --shadow:0 12px 28px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Cairo', sans-serif; background:var(--beige); color:var(--black); direction:rtl; }
    h1,h2,h3,h4 { font-family:'Amiri', serif; }
    .hidden { display:none !important; }
    
    /* شاشة الدخول */
    .login-wrap { min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg, #f8eee4, #f0e2d0); }
    .login-box { background:#fff; border-radius:22px; box-shadow:var(--shadow); width:min(420px, calc(100% - 24px)); padding:28px; text-align:center; }
    .login-box h2 { font-size:2.3rem; color:var(--wine-deep); margin-bottom:20px; }
    .field { display:grid; gap:8px; margin-bottom:15px; text-align:right; }
    .field label { font-weight:700; color:var(--wine-deep); font-size:14px; }
    .field input, .field textarea, .field select { width:100%; border:1px solid #ddd; border-radius:10px; padding:12px 14px; background:#fff; font-family:inherit; }
    .field textarea { min-height:100px; resize:vertical; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:12px 18px; border:none; border-radius:12px; cursor:pointer; font-weight:800; font-family:inherit; transition:0.2s; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:var(--wine); color:#fff; width:100%; }
    .btn-gold { background:var(--gold); color:var(--wine-deep); }
    .btn-danger { background:#c74d4d; color:#fff; }
    .btn-gray { background:#e0e0e0; color:#333; }

    /* الهيكل الرئيسي */
    .topbar { background:var(--wine-deep); color:var(--gold-light); padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
    .topbar h2 { font-size:1.8rem; }
    .topbar button { border:none; background:#8a1c1c; color:#fff; padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer; }
    .tabs { display:flex; gap:10px; flex-wrap:wrap; background:#fff; padding:15px 20px; border-bottom:1px solid rgba(0,0,0,0.08); }
    .tab-btn { border:none; background:transparent; padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer; color:var(--wine-deep); font-family:inherit; font-size:15px; }
    .tab-btn.active { background:var(--wine); color:#fff; }
    .content { padding:24px; max-width:1000px; margin:0 auto; }
    .panel { display:none; }
    .panel.active { display:block; }
    .card { background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:24px; margin-bottom:20px; }
    .card h3 { color:var(--wine-deep); font-size:1.5rem; margin-bottom:20px; border-bottom:2px solid var(--gold); padding-bottom:10px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    @media(max-width:600px) { .two-col { grid-template-columns:1fr; } }

    /* بطاقات المنتجات */
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
    .product-card { border:1px solid #eee; border-radius:14px; overflow:hidden; background:#fafafa; }
    .product-card img { width:100%; height:150px; object-fit:cover; }
    .product-info { padding:12px; }
    .product-info h4 { font-size:1rem; color:var(--wine-deep); margin-bottom:5px; }
    .product-info p { font-size:12px; color:var(--muted); margin-bottom:10px; }
    .product-actions { display:flex; gap:5px; }
    .product-actions button { flex:1; border:none; padding:8px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; }
    
    /* النوافذ المنبثقة */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:20px; z-index:100; overflow-y:auto; }
    .modal.open { display:flex; }
    .modal-box { background:#fff; border-radius:18px; width:min(700px, 100%); padding:24px; max-height:90vh; overflow-y:auto; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .modal-head h3 { font-size:1.5rem; color:var(--wine-deep); }

    /* إشعارات */
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px); background:#25D366; color:#fff; padding:14px 28px; border-radius:30px; font-weight:700; z-index:200; opacity:0; transition:0.3s; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-box">
      <h2>لوحة التحكم</h2>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input id="emailInput" type="email" value="admin@asala.com" />
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input id="passInput" type="password" value="asala2026" />
      </div>
      <button class="btn btn-primary" onclick="login()">دخول</button>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="adminApp" class="hidden">
    <div class="topbar">
      <h2>⚙️ لوحة تحكم أصالة التراث</h2>
      <div>
        <button onclick="window.open('index.html', '_blank')" style="background:var(--gold);color:var(--wine-deep);margin-left:10px;">👁️ معاينة</button>
        <button onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('products')">📦 المنتجات</button>
      <button class="tab-btn" onclick="showTab('settings')">🏠 إعدادات الموقع</button>
      <button class="tab-btn" onclick="showTab('backup')">💾 تصدير / استيراد</button>
    </div>

    <div class="content">
      
      <!-- تبويب المنتجات -->
      <div id="products" class="panel active">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0; border:none;">إدارة المنتجات</h3>
            <button class="btn btn-gold" onclick="openProductForm()">➕ إضافة منتج جديد</button>
          </div>
          <div class="product-grid" id="adminProductList"></div>
        </div>
      </div>

      <!-- تبويب الإعدادات -->
      <div id="settings" class="panel">
        <div class="card">
          <h3>الإعدادات العامة</h3>
          <div class="two-col">
            <div class="field"><label>اسم المتجر</label><input id="storeName" /></div>
            <div class="field"><label>رقم الواتساب (بدون +)</label><input id="waNumber" /></div>
            <div class="field" style="grid-column:1/-1;"><label>نص الشريط العلوي</label><input id="topbar" /></div>
            <div class="field"><label>عنوان الغلاف (Hero Title)</label><input id="heroTitle" /></div>
            <div class="field"><label>وصف الغلاف (Hero Description)</label><input id="heroDesc" /></div>
            <div class="field"><label>رابط إنستغرام</label><input id="instagram" /></div>
            <div class="field"><label>رابط فيسبوك</label><input id="facebook" /></div>
            <div class="field"><label>رابط تيك توك</label><input id="tiktok" /></div>
            <div class="field"><label>البريد الإلكتروني</label><input id="email" /></div>
            <div class="field" style="grid-column:1/-1;"><label>نص حكاية الصنعة</label><textarea id="storyText"></textarea></div>
          </div>
          <div style="margin-top:20px;">
            <button class="btn btn-primary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
          </div>
        </div>
      </div>

      <!-- تبويب النسخ الاحتياطي -->
      <div id="backup" class="panel">
        <div class="card">
          <h3>تصدير / استيراد</h3>
          <p style="margin-bottom:15px; color:var(--muted); line-height:1.8;">
            <b>ملحوظة هامة:</b> بعد تعديل المنتجات أو الإعدادات، اضغط على "تصدير products.json" لتحميل الملف، ثم ارفعه على GitHub مكان الملف القديم. هذا هو السر الذي يجعل التعديلات تظهر للعملاء.
          </p>
          <button class="btn btn-primary" onclick="exportJson()" style="margin-bottom:15px;">📥 تصدير products.json</button>
          <input id="importFile" type="file" accept=".json" style="display:none;" onchange="importJson(this)" />
          <button class="btn btn-gold" onclick="document.getElementById('importFile').click()">📤 استيراد ملف JSON</button>
        </div>
      </div>

    </div>
  </div>

  <!-- نافذة إضافة/تعديل المنتج -->
  <div id="productModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">إضافة منتج</h3>
        <button class="btn btn-danger" onclick="closeProductModal()">إغلاق</button>
      </div>
      <div class="two-col">
        <div class="field"><label>اسم المنتج (عربي)</label><input id="pName" /></div>
        <div class="field"><label>اسم المنتج (إنجليزي)</label><input id="pNameEn" /></div>
        <div class="field"><label>التصنيف</label><input id="pCategory" placeholder="مثال: أثاث ملكي" /></div>
        <div class="field"><label>الإصدار</label><input id="pVersion" /></div>
        <div class="field"><label>السعر الحالي</label><input id="pPrice" type="number" step="0.001" /></div>
        <div class="field"><label>السعر القديم</label><input id="pOldPrice" type="number" step="0.001" /></div>
        <div class="field"><label>نسبة الخصم %</label><input id="pDiscount" type="number" /></div>
        <div class="field"><label>منتج مميز؟</label>
          <select id="pFeatured"><option value="false">لا</option><option value="true">نعم</option></select>
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label>رابط الصورة (ضع هنا الرابط الذي يبدأ بـ https://raw...)</label>
          <input id="pImage" placeholder="https://raw.githubusercontent.com/..." />
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label>الوصف</label>
          <textarea id="pDescription"></textarea>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveProduct()" style="margin-top:15px;">💾 حفظ المنتج</button>
    </div>
  </div>

  <div class="toast" id="toast">تم الحفظ</div>

  <script>
    const STORAGE_KEY = "asala_admin_data";
    const defaultState = {
      store: {
        name: "أصالة التراث المصري",
        topbar: "أصالة مدى الحياة ♾️ - صدف طبيعي 100% - صناعة يدوية من خان الخليلي - شحن من الكويت للعالم",
        heroTitle: "قطعة من مصر، وحكاية في بيتك",
        heroDesc: "من بريق الصدف الطبيعي ودِفء الخشب الأصيل، نصنع قطعاً تحمل روح التراث المصري.",
        waNumber: "96551118069",
        email: "hello@asala-heritage.com",
        instagram: "https://www.instagram.com/asalat.al.torath.kw.eg",
        facebook: "https://www.facebook.com/share/1ddcccaFpo/?mibextid=wwXIfr",
        tiktok: "https://www.tiktok.com/@asalat.al.torath5",
        storyText: "في ورشتنا في خان الخليلي، نختار كل شظية صدف بعناية، ثم ندمجها مع الخشب الأصيل."
      },
      products: [],
      reviews: []
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultState));
    let currentEditId = null;

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function login() {
      if (document.getElementById('emailInput').value === 'admin@asala.com' && document.getElementById('passInput').value === 'asala2026') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminApp').classList.remove('hidden');
        fillSettings();
        renderProducts();
      } else { alert('بيانات الدخول غير صحيحة'); }
    }

    function logout() {
      document.getElementById('adminApp').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    function showTab(tab) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const map = {products:0, settings:1, backup:2};
      document.querySelectorAll('.tab-btn')[map[tab]].classList.add('active');
    }

    function fillSettings() {
      document.getElementById('storeName').value = state.store.name || '';
      document.getElementById('waNumber').value = state.store.waNumber || '';
      document.getElementById('topbar').value = state.store.topbar || '';
      document.getElementById('heroTitle').value = state.store.heroTitle || '';
      document.getElementById('heroDesc').value = state.store.heroDesc || '';
      document.getElementById('instagram').value = state.store.instagram || '';
      document.getElementById('facebook').value = state.store.facebook || '';
      document.getElementById('tiktok').value = state.store.tiktok || '';
      document.getElementById('email').value = state.store.email || '';
      document.getElementById('storyText').value = state.store.storyText || '';
    }

    function renderProducts() {
      const list = document.getElementById('adminProductList');
      if (!state.products.length) {
        list.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">لا توجد منتجات حالياً. اضغط "إضافة منتج جديد".</p>';
        return;
      }
      list.innerHTML = state.products.map(item => `
        <div class="product-card">
          <img src="${item.image || 'https://via.placeholder.com/300?text=No+Image'}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
          <div class="product-info">
            <h4>${item.name}</h4>
            <p>${item.category} — ${item.price} د.ك</p>
            <div class="product-actions">
              <button style="background:#f0e8d8; color:var(--wine-deep);" onclick="editProduct(${item.id})">✏️ تعديل</button>
              <button style="background:#fee; color:#c0392b;" onclick="deleteProduct(${item.id})">🗑️ حذف</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openProductForm() {
      currentEditId = null;
      document.getElementById('modalTitle').textContent = 'إضافة منتج جديد';
      ['pName','pNameEn','pCategory','pVersion','pPrice','pOldPrice','pDiscount','pImage','pDescription'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('pFeatured').value = 'false';
      document.getElementById('productModal').classList.add('open');
    }

    function closeProductModal() { document.getElementById('productModal').classList.remove('open'); }

    function editProduct(id) {
      const item = state.products.find(p => p.id === id);
      if (!item) return;
      currentEditId = id;
      document.getElementById('modalTitle').textContent = 'تعديل المنتج';
      document.getElementById('pName').value = item.name;
      document.getElementById('pNameEn').value = item.nameEn || '';
      document.getElementById('pCategory').value = item.category;
      document.getElementById('pVersion').value = item.version || '';
      document.getElementById('pPrice').value = item.price;
      document.getElementById('pOldPrice').value = item.oldPrice || '';
      document.getElementById('pDiscount').value = item.discount || 0;
      document.getElementById('pFeatured').value = item.featured ? 'true' : 'false';
      document.getElementById('pImage').value = item.image || '';
      document.getElementById('pDescription').value = item.description || '';
      document.getElementById('productModal').classList.add('open');
    }

    function saveProduct() {
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value.trim();
      const price = Number(document.getElementById('pPrice').value);
      const image = document.getElementById('pImage').value.trim();

      if (!name || !category || !image) {
        alert('يرجى تعبئة الاسم، التصنيف، ورابط الصورة.');
        return;
      }

      const product = {
        id: currentEditId || Date.now(),
        name: name,
        nameEn: document.getElementById('pNameEn').value.trim(),
        category: category,
        version: document.getElementById('pVersion').value.trim(),
        price: price,
        oldPrice: Number(document.getElementById('pOldPrice').value) || 0,
        discount: Number(document.getElementById('pDiscount').value) || 0,
        featured: document.getElementById('pFeatured').value === 'true',
        image: image,
        description: document.getElementById('pDescription').value.trim()
      };

      if (currentEditId) {
        state.products = state.products.map(p => p.id === currentEditId ? product : p);
      } else {
        state.products.push(product);
      }

      saveState();
      renderProducts();
      closeProductModal();
      toast('✅ تم حفظ المنتج. لا تنسَ تصدير products.json');
    }

    function deleteProduct(id) {
      if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
      state.products = state.products.filter(p => p.id !== id);
      saveState();
      renderProducts();
    }

    function saveSettings() {
      state.store.name = document.getElementById('storeName').value.trim();
      state.store.waNumber = document.getElementById('waNumber').value.trim();
      state.store.topbar = document.getElementById('topbar').value.trim();
      state.store.heroTitle = document.getElementById('heroTitle').value.trim();
      state.store.heroDesc = document.getElementById('heroDesc').value.trim();
      state.store.instagram = document.getElementById('instagram').value.trim();
      state.store.facebook = document.getElementById('facebook').value.trim();
      state.store.tiktok = document.getElementById('tiktok').value.trim();
      state.store.email = document.getElementById('email').value.trim();
      state.store.storyText = document.getElementById('storyText').value.trim();
      
      saveState();
      toast('✅ تم حفظ الإعدادات. لا تنسَ تصدير products.json');
    }

    function exportJson() {
      const data = JSON.stringify(state, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'products.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('✅ تم تحميل الملف. ارفعه على GitHub الآن.');
    }

    function importJson(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.products) {
            state = parsed;
            saveState();
            fillSettings();
            renderProducts();
            toast('✅ تم استيراد البيانات بنجاح');
          } else { alert('ملف JSON غير صحيح'); }
        } catch (err) { alert('حدث خطأ أثناء قراءة الملف'); }
      };
      reader.readAsText(file);
    }

    // التهيئة الأولية
    fillSettings();
    renderProducts();
  </script>
</body>
</html>
